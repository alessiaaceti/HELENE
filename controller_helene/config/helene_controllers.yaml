controller_manager:
  ros__parameters:
    update_rate: 1000 # !!! 
    
    # define the names of our controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    helene_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    helene_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # force-torque sensor broadcaster for the end-effector
    helene_force_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

helene_velocity_controller:
  ros__parameters:
    # these names must match the ones in the URDF
    joints:
      - q1
      - q2
      - q3
      - q4
      - q5
      - q6
    interface_name: velocity

helene_trajectory_controller:
  ros__parameters:
    # these names must match the ones in the URDF
    joints:
      - q1
      - q2
      - q3
      - q4
      - q5
      - q6

    # command interfaces that the controller will accept
    command_interfaces:
      - position

    # state interfaces that the controller will read from the hardware interface
    state_interfaces:
      - position
      - velocity

    # controller parameters (these can be tuned as needed) -> 
    state_publish_rate: 1000.0     # !!!!
    action_monitor_rate: 10.0
    allow_partial_joints_goal: false
    open_loop_control: false

    gains:
      q1: {p: 1000.0, i: 1.0, d: 10.0}
      q2: {p: 1000.0, i: 1.0, d: 10.0}
      q3: {p: 1000.0, i: 1.0, d: 10.0}
      q4: {p: 500.0, i: 1.0, d: 5.0}
      q5: {p: 500.0, i: 1.0, d: 5.0}
      q6: {p: 100.0, i: 1.0, d: 1.0}

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      q1: { trajectory: 0.0, goal: 0.0 }
      q2: { trajectory: 0.0, goal: 0.0 }
      q3: { trajectory: 0.0, goal: 0.0 }
      q4: { trajectory: 0.0, goal: 0.0 }
      q5: { trajectory: 0.0, goal: 0.0 }
      q6: { trajectory: 0.0, goal: 0.0 }

joint_state_broadcaster:
  ros__parameters:
    # Use empty joints list to broadcast all available interfaces 
    # (q1-q6) found in the hardware interface.
    # If you leave this out, it defaults to "all".
    use_local_topics: false

helene_force_broadcaster:
  ros__parameters:
    sensor_name: tcp_force_torque_sensor # Must match the <sensor> tag in the URDF !!!!
    frame_id: axis_6 # Must match the <origin> frame in the URDF for the sensor !!!!
    #interface_names:
    #  force:
    #    x: force.x
    #    y: force.y
    #    z: force.z
    #  torque:
    #    x: torque.x
    #    y: torque.y
    #    z: torque.z