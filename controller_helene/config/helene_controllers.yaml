controller_manager:
  ros__parameters:
    update_rate: 100 # !!! 
    
    # define the names of our controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    helene_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    helene_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # force-torque sensor broadcaster for the end-effector
    #helene_force_broadcaster:
    #  type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

helene_velocity_controller:
  ros__parameters:
    # these names must match the ones in the URDF
    joints:
      - q1
      - q2
      - q3
      - q4
      - q5
      - q6
    interface_name: velocity

helene_trajectory_controller:
  ros__parameters:
    joints:
      - q1
      - q2
      - q3
      - q4
      - q5
      - q6

    # send commands to the robot in velocity mode, not position mode
    command_interfaces:
      #- position
      - velocity

    # receive feedback from the robot in position and velocity
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0 
    action_monitor_rate: 10.0
    allow_partial_joints_goal: true   # Allows sending goals that only specify a subset of joints, which can be useful for testing or if you have multiple controllers managing different joints. Set to false if you want to enforce that all joints must be specified in every goal.
    open_loop_control: false  # Set to true if you want the controller to operate in open-loop mode, where it doesn't rely on feedback from the robot's state. This can be useful for simulation or testing, but may lead to inaccuracies in real-world scenarios.
    #interpolation_method: linear    # Specifies the interpolation method for trajectory execution. Options include 'linear', 'cubic', and 'quintic'. Choose based on the desired smoothness of motion.

    gains:
      q1: {p: 50.0, i: 0.1, d: 0.0, i_clamp: 0.3}
      q2: {p: 10.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0}
      q3: {p: 10.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0}
      q4: {p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0}
      q5: {p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0}
      q6: {p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0}

    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.5
      q1: {trajectory: 0.8, goal: 0.8}
      q2: {trajectory: 0.8, goal: 0.8}
      q3: {trajectory: 0.8, goal: 0.8}
      q4: {trajectory: 0.8, goal: 0.8}
      q5: {trajectory: 0.8, goal: 0.8}
      q6: {trajectory: 0.8, goal: 0.8}

joint_state_broadcaster:
  ros__parameters:
    # Use empty joints list to broadcast all available interfaces 
    # (q1-q6) found in the hardware interface.
    # If you leave this out, it defaults to "all".
    use_local_topics: false

